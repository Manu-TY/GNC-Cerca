<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNC Cerca</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <meta name="theme-color" content="#2e7d32">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            padding: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        header h1 {
            color: #2e7d32;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .search-container {
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .input-group input {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: #2e7d32;
        }

        #destino {
            flex: 2;
            min-width: 180px;
        }

        #localidad {
            flex: 1;
            min-width: 130px;
        }

        .btn-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #2e7d32;
            color: white;
            flex: 2;
        }

        .btn-primary:hover {
            background: #1b5e20;
        }

        .btn-gps {
            background: #0b5ed7;
            color: white;
            flex: 1;
        }

        .btn-gps:hover {
            background: #0a58ca;
        }

        #mapa {
            height: 350px;
            width: 100%;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            z-index: 1;
        }

        #resultado {
            min-height: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⛽ GNC Cerca</h1>
    </header>

    <div class="search-container">
        <div class="input-group">
            <input type="text" id="destino" placeholder="Dirección (ej: Av. Rivadavia 1200)">
            <input type="text" id="localidad" placeholder="Localidad (ej: Quilmes)">
        </div>
        <div class="btn-actions">
            <button class="btn btn-primary" onclick="buscarDestino()">🔍 Buscar Direccion</button>
            <button class="btn btn-gps" onclick="buscar()">📡 Usar GPS</button>
        </div>
    </div>

    <div id="mapa"></div>
    <div id="resultado"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
