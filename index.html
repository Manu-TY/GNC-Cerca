<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNC Cerca</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="theme-color" content="#2e7d32">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            padding: 12px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 14px;
        }

        header h1 {
            color: #2e7d32;
            font-size: 1.5rem;
        }

        /* Botón de instalación destacado */
        #btnInstalarPWA {
            display: none;
            width: 100%;
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            text-align: center;
        }

        .search-container {
            background: #ffffff;
            padding: 14px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 12px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: #2e7d32;
        }

        .btn-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 11px 14px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background: #2e7d32;
            color: white;
            flex: 2;
        }

        .btn-gps {
            background: #1976d2;
            color: white;
            flex: 1;
        }

        #mapa {
            height: 350px;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            z-index: 1;
        }

        #resultado {
            min-height: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>GNC Cerca</h1>
    </header>

    <!-- BOTÓN INSTALAR (Se activa sólo si la app no está instalada) -->
    <button id="btnInstalarPWA" onclick="instalarPWA()">📲 Instalar aplicación en el teléfono</button>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="destino" placeholder="Escribí una calle o localidad (ej: Rivadavia 1200, Quilmes)">
        </div>
        <div class="btn-actions">
            <button class="btn btn-primary" onclick="buscarDestino()">Buscar</button>
            <button class="btn btn-gps" onclick="buscar()">Mi Ubicación</button>
        </div>
    </div>

    <div id="mapa"></div>
    <div id="resultado"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
