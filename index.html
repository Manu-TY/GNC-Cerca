<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNC Cerca - Estaciones de Argentina</title>

    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b5ed7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448339.png">

    <!-- Tarjeta de Vista Previa para WhatsApp y Redes Sociales -->
    <meta property="og:title" content="⛽ GNC Cerca - App de Estaciones">
    <meta property="og:description" content="Instalá la app en tu celular para encontrar las estaciones de GNC más cercanas en Argentina.">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/3448/3448339.png">
    <meta property="og:url" content="https://manu-ty.github.io/GNC-Cerca/">
    <meta property="og:type" content="website">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.6rem;
            color: #0b5ed7;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 12px 16px;
            background-color: #0b5ed7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            background-color: #0a58ca;
        }

        .btn-gps {
            width: 100%;
            background-color: #198754;
            margin-bottom: 10px;
        }

        .btn-gps:active {
            background-color: #157347;
        }

        .btn-pwa {
            width: 100%;
            background-color: #ffc107;
            color: #000;
            margin-bottom: 15px;
            display: none;
        }

        .btn-pwa:active {
            background-color: #e0a800;
        }

        #mapa {
            height: 320px;
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        #resultado {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⛽ GNC Cerca</h1>
    </header>

    <div class="search-box">
        <input type="text" id="destino" placeholder="Buscar dirección o ciudad...">
        <button onclick="buscarDestino()">Buscar</button>
    </div>

    <button class="btn-gps" onclick="buscar()">📍 Buscar cerca mío (GPS)</button>

    <button id="btnInstalar" class="btn-pwa">📲 ¡Instalar App en el Celular!</button>

    <div id="mapa"></div>

    <div id="resultado"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Lógica principal de la aplicación -->
    <script src="app.js"></script>

    <!-- Registro de Service Worker y Manejo de Instalación PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker registrado correctamente'))
                .catch((err) => console.error('Error al registrar Service Worker:', err));
        }

        let eventoInstalacion;
        const botonInstalar = document.getElementById('btnInstalar');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            eventoInstalacion = e;
            botonInstalar.style.display = 'block';
        });

        botonInstalar.addEventListener('click', () => {
            if (eventoInstalacion) {
                eventoInstalacion.prompt();
                eventoInstalacion.userChoice.then(() => {
                    botonInstalar.style.display = 'none';
                });
            }
        });
    </script>
</body>
</html>
